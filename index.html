<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>9-Month Current Affairs Marathon — MCQ Master Test</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--soft:#f8fafc;--text:#172033;--muted:#667085;--border:#dfe4ec;--primary:#2563eb;--success:#15803d;--danger:#dc2626;--warning:#a16207;--shadow:0 8px 24px rgba(15,23,42,.06);--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:auto;padding:18px}
.hero,.card,.question{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 8px;font-size:25px}
.note{background:#fff8e7;border:1px solid #ead7a1;padding:12px 14px;border-radius:10px;color:#624d14}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
.part{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;text-align:left}
.part:hover{border-color:#9eb5ea;box-shadow:0 7px 18px rgba(37,99,235,.08)}
.part b{display:block;margin-bottom:3px}
.header{position:sticky;top:0;z-index:10;background:rgba(246,248,251,.94);backdrop-filter:blur(10px);padding:10px 0;border-bottom:1px solid var(--border)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.timer{font-weight:800}
.progress{height:8px;background:#e9edf4;border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--primary);width:0}
.question{padding:19px;margin:14px 0}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qnum{color:var(--primary);font-weight:800}
.qtext{font-size:17px;font-weight:650;margin:8px 0 14px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px;text-align:left;transition:.15s}
.opt:hover{border-color:#9eb5ea;background:#f8fbff}
.opt.correct{border-color:#86c99d;background:#ecfdf3;color:#166534}
.opt.wrong{border-color:#f2a3a3;background:#fef2f2;color:#991b1b}
.opt.disabled{cursor:default}
.explain{display:none;margin-top:13px;padding:12px;border-left:4px solid var(--primary);background:var(--soft);border-radius:8px}
.explain.show{display:block}
.key{margin-top:8px;font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.btn{border:1px solid var(--border);background:#fff;padding:10px 14px;border-radius:10px;font-weight:750}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.danger{background:#fff1f2;color:#991b1b;border-color:#fecdd3}
#result{display:none;padding:20px;margin:16px 0}
.collections{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.collection{padding:14px;border:1px solid var(--border);border-radius:12px;background:#fff}
.small{color:var(--muted);font-size:13px}
@media(max-width:700px){.options{grid-template-columns:1fr}.collections{grid-template-columns:1fr}.qtext{font-size:16px}.hero h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>9-Month Current Affairs Marathon — MCQ Master Test</h1>
    <div class="small">Source: uploaded YouTube content only • 713 extracted MCQs • 50 questions per part</div>
    
  </div>

  <div id="hub" class="card" style="padding:16px">
    <h2 style="margin-top:0">Choose a Part</h2>
    <div class="parts" id="parts"></div>
  </div>

  <div id="test" style="display:none">
    <div class="header">
      <div class="stats">
        <span class="pill" id="partLabel"></span>
        <span class="pill">Correct: <b id="correctCount">0</b></span>
        <span class="pill">Incorrect: <b id="wrongCount">0</b></span>
        <span class="pill">Unvisited: <b id="unvisitedCount">0</b></span>
        <span class="pill timer">⏱ <span id="timer">10:00</span></span>
      </div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>

    <div class="actions">
      <button class="btn" onclick="backToHub()">← Parts</button>
      <button class="btn primary" onclick="finishTest()">🏁 Finish Test</button>
      <button class="btn danger" onclick="resetPart()">↻ Reset Part</button>
    </div>

    <div id="questions"></div>

    <div id="result" class="card">
      <h2>Test Result</h2>
      <div id="resultText"></div>
      <div class="collections" style="margin-top:14px">
        <div class="collection"><b>Correct</b><div id="correctList" class="small"></div></div>
        <div class="collection"><b>Incorrect</b><div id="wrongList" class="small"></div></div>
        <div class="collection"><b>Unvisited / Unanswered</b><div id="unvisitedList" class="small"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"id":1,"q":"नीति आयोग के उपाध्यक्ष कौन हैं?","options":["ज्ञानेश कुमार","डॉ. अरविंद पनगढ़िया","अशोक कुमार लाहिड़ी","विवेक जोशी"],"answer":"C","answer_text":"अशोक कुमार लाहिड़ी","explanation":"अशोक कुमार लाहिड़ी नीति आयोग के उपाध्यक्ष हैं"},{"id":2,"q":"भारत के मुख्य चुनाव आयुक्त कौन हैं?","options":["ज्ञानेश कुमार","विवेक जोशी","सुखबीर सिंह संधू","अशोक कुमार लाहिड़ी"],"answer":"A","answer_text":"ज्ञानेश कुमार","explanation":"ज्ञानेश कुमार भारत के मुख्य चुनाव आयुक्त हैं"},{"id":3,"q":"भारत के अन्य दो चुनाव आयुक्त कौन हैं?","options":["अशोक कुमार लाहिड़ी और के. संजय मूर्ति","ज्ञानेश कुमार और अरविंद पनगढ़िया","विवेक जोशी और सुखबीर सिंह संधू","टी.सी.ए. कल्याणी और सौरभ विजय"],"answer":"C","answer_text":"विवेक जोशी और सुखबीर सिंह संधू","explanation":"विवेक जोशी और सुखबीर सिंह संधू भारत के चुनाव आयुक्त हैं"},{"id":4,"q":"16वें वित्त आयोग के अध्यक्ष कौन हैं?","options":["ज्ञानेश कुमार","अशोक कुमार लाहिड़ी","डॉ. अरविंद पनगढ़िया","के. संजय मूर्ति"],"answer":"C","answer_text":"डॉ. अरविंद पनगढ़िया","explanation":"डॉ. अरविंद पनगढ़िया 16वें वित्त आयोग के अध्यक्ष हैं"},{"id":5,"q":"भारत के नियंत्रक एवं महालेखा परीक्षक (CAG) कौन हैं?","options":["टी.सी.ए. कल्याणी","अशोक कुमार लाहिड़ी","ज्ञानेश कुमार","के. संजय मूर्ति"],"answer":"D","answer_text":"के. संजय मूर्ति","explanation":"के. संजय मूर्ति भारत के नियंत्रक एवं महालेखा परीक्षक (CAG) हैं"},{"id":6,"q":"भारत के लेखा महानियंत्रक (CGA) कौन हैं?","options":["अशोक कुमार लाहिड़ी","टी.सी.ए. कल्याणी","ज्ञानेश कुमार","के. संजय मूर्ति"],"answer":"B","answer_text":"टी.सी.ए. कल्याणी","explanation":"टी.सी.ए. कल्याणी भारत की लेखा महानियंत्रक (CGA) हैं"},{"id":7,"q":"भारत के अटॉर्नी जनरल कौन हैं?","options":["ज्ञानेश कुमार","अशोक कुमार लाहिड़ी","आर. वेंकटरमणी","तुषार मेहता"],"answer":"C","answer_text":"आर. वेंकटरमणी","explanation":"आर. वेंकटरमणी भारत के अटॉर्नी जनरल हैं"},{"id":8,"q":"भारत के कैबिनेट सचिव कौन हैं?","options":["टी.वी. सोमनाथन","ज्ञानेश कुमार","विक्रम मिस्री","अशोक कुमार लाहिड़ी"],"answer":"A","answer_text":"ट री पैटन वो हैं ब्रिटेन के और हेरी हेली यो वारा ये फिनलैंड के हैं"],"answer":"D","answer_text":"हेनरी पैटन वो हैं ब्रिटेन के और हेरी हेली यो वारा ये फिनलैंड के हैं","explanation":"तो उन्होंने जीत हासिल की है। अगला क्वेश्चन होगा कि विंबल्डन 2026 वमस डबल्स का खिताब किसने जीता है"},{"id":408,"q":"होगा कि विंबल्डन 2026 वमस डबल्स का खिताब किसने जीता है","options":["अशोक लाहड़ी हैं","गु हनिय जो चीन की हैं और दूसरा नाम है क्रिस्टीना मला डेन नोविच ये फ्रांस की हैं","ज्ञानेश कुमार हैं",""],"answer":"B","answer_text":"गु हनिय जो चीन की हैं और दूसरा नाम है क्रिस्टीना मला डेन नोविच ये फ्रांस की हैं","explanation":"तो इन दोनों ने फाइनल में जीत हासिल की है। विंबल्डन 2026 मिक्स डबल्स का खिताब किसने जीता है"},{"id":409,"q":"विंबल्डन 2026 मिक्स डबल्स का खिताब किसने जीता है","options":["मार्शेलो अवेलारो इलात्विया के हैं और जेलेना ऑस्ट पेंको यह अलसवाडोर के हैं","","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं"],"answer":"A","answer_text":"मार्शेलो अवेलारो इलात्विया के हैं और जेलेना ऑस्ट पेंको यह अलसवाडोर के हैं","explanation":"तो इन्होंने जीत हासिल की है। अब विजेताओं की एक बार लिस्ट देख लेते हैं फटाफट। तो मेंस सिंगल्स के विजेता हैं जेनेक्सिनर। वमस सिंगल्स की विजेता है लिंडा नोस्कोवा। मेंस डबल्स के जो विजेता है वह हरी हेली योवारा और हेनरी पैटर्न। वमस डबल्स के विजेता हो हनियो और क्रिस्टना मलाडे नोविक और मिक्स डबल्स मार्सलो एरे वालो और जेलेना ओस्टा पेंको तो ये जो है ना वो विजेता हैं ये सब अक्सर एग्जामिनेशन में ये जो ये है इन सब से रिलेटेड क्वेश्चन पूछे जाते हैं। कि डायमंड लीग 2026 में मेडल जीतने वाले पहले भारतीय हाई जंपर कौ"},{"id":410,"q":"डायमंड लीग 2026 में मेडल जीतने वाले पहले भारतीय हाई जंपर कौन हो गए हैं","options":["ज्ञानेश कुमार हैं","","अशोक लाहड़ी हैं","सर्वेश सर्वेश कोषारे डायमंड लीग के पोडियम में पहुंचने वाले पहले भारतीय हाई जंपर हैं और ओवरऑल चौथे भारतीय एथलीट बन गए हैं"],"answer":"D","answer_text":"सर्वेश सर्वेश कोषारे डायमंड लीग के पोडियम में पहुंचने वाले पहले भारतीय हाई जंपर हैं और ओवरऑल चौथे भारतीय एथलीट बन गए हैं","explanation":"ओके तो इससे पहले अगर एथलीट की बात करेंगे तो नीरज चोप ै वो इतना गर्म है कि वो चमकता है और 66 करोड़ साल पहले की ये तस्वीर है। मतलब कि जब भी हम क्योंकि लाइट की स्पीड होती है तो जो ये जो देख रहे हैं वो इतने साल करोड़ साल पहले की लाइट अभी पहुंची है टीम्स वेब पर और वो यह पता चला है। कि इसरो के सतीश धवन अंतरि"},{"id":555,"q":"इसरो के सतीश धवन अंतरिक्ष केंद्र से किस निजी कंपनी के रॉकेट विक्रम वन ने भारत का पहला निजी ऑर्बिटल ल्च सफलतापूर्वक किया है","options":["ज्ञानेश कुमार हैं","","अशोक लाहड़ी हैं","वह है स्काई रूट एरोस्पेस"],"answer":"D","answer_text":"वह है स्काई रूट एरोस्पेस","explanation":"श्रीहरिकोटा में स्थित है जो सतीश धवन अंतरिक्ष केंद्र। वहीं से 18 जुलाई को यह पहला निजी यह रॉकेट था जिसने उड़ान भरी थी प्रक्षेपण हुआ था जो कि ये ध्रुवीय मतलब ध्रुवीय सॉरी ऑर्बिटल ऑर्बिटल ये रॉकेट था। ऑर्बिटल मतलब क्या हुआ कि मतलब ऐसी ऊंचाई पर जाना जहां से लॉक हो जाता है कोई भी वस्तु ना तो अंतरिक्ष के बाहर जाएगा और ना ही पृथ्वी पर गिरेगा वह और पृथ्वी का चक्कर लगाता रहेगा। उस ऑर्बिटल हुआ"},{"id":556,"q":"चीन की जो स्पेस एजेंसी है उसका नाम क्या है","options":["सीएनएसए यानी चाइना नेशनल स्पेस एडमिनिस्ट्रेशन","बीजेपी","धार","नेशनल ह्यूमन राइट्स कमीशन"],"answer":"A","answer_text":"सीएनएसए यानी चाइना नेशनल स्पेस एडमिनिस्ट्रेशन","explanation":"तो ये परीक्षण हुआ है 10 जुलाई को। ओके। तो ये पहली बार ऐसा किया गया है"},{"id":557,"q":"सोशल मीडिया के उपयोग के लिए न्यूनतम 15 वर्ष आयु निर्धारित करने वाला पहला अरब देश कौन बन गया है","options":["अशोक लाहड़ी हैं","","यूएई यानी संयुक्त अरब अमीरात","ज्ञानेश कुमार हैं"],"answer":"C","answer_text":"यूएई यानी संयुक्त अरब अमीरात","explanation":"तो उसी ने 18 जून को जो है ना वो नया नियम पारित करके यह तय कर दिया है कि 15 वर्ष मिनिमम है। उससे कम के जो बच्चे हैं वह नहीं देख पाएंगे। सेफ्टी फीचर्स भी लगेंगे। अगर 15 से जो है ना 16 वर्ष के अगर बच्चे देख रहे हैं तब भी यूएई जो देख रहे हैं मैप में यहां पर है और इसकी राजधानी अबू धाबी है"},{"id":558,"q":"कि ब्रिटेन ने किस आयु से कम उम्र के सभी बच्चों के लिए सोशल मीडिया पर बैन लगाया","options":["₹00 से ₹1 लाख देने का ऐलान किया है","16 वर्ष से कम उम्र के सभी बच्चों पर बैन लगा दि म जोड़ दिया","explanation":""},{"id":563,"q":"भारत में सेल्फ ब्रॉडकास्ट अलर्ट सिस्टम का विकास किस संस्थान ने किया","options":["ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","जिसे सचेत इमरजेंसी अलर्ट सिस्टम कहा गया है",""],"answer":"C","answer_text":"जिसे सचेत इमरजेंसी अलर्ट सिस्टम कहा गया है","explanation":"सी डॉट ने किया है। और कुछ वक्त पहले ही आपके मोबाइल पे भी आया होगा। तेजी से मतलब ब्लिंक कर रहा है मोबाइल और आवाज अलग बीप की। जब तक बंद ना कर रहे हैं तब तक आवाज हो रही। वाइब्रेट कर रहा होगा। तो ये एक तरह से सरकार ने जो है ना इमरजेंसी की सिचुएशंस में इंफॉर्मेशन पहुंचाने के लिए खास तौर का ये विकसित किया है सी डॉट के द्वारा"},{"id":564,"q":"क्रिटिकैलिटी का मतलब क्या हुआ","options":["अशोक लाहड़ी हैं","यह जो है ना नाभिकीय विखंडन यानी न्यूक्लियर चेन ऑटोमेटिक रूप से वह चलने लगा है","","ज्ञानेश कुमार हैं"],"answer":"B","answer_text":"यह जो है ना नाभिकीय विखंडन यानी न्यूक्लियर चेन ऑटोमेटिक रूप से वह चलने लगा है","explanation":"मतलब उसमें एक बार स्टार्ट करने के बाद उसको किसी सहायता की जरूरत नहीं है। तो इससे क्या है वो बिजली उत्पादन करने के योग्य हो चुका है। तो कल्पम में भारतीय नाभिकीय जो विद्युत निगम लिमिटेड है भावनी कहते हैं शॉर्ट में। तो उसी ने इसको स्थापित किया है। 500 मेगावाट का प्रोटोटाइप फास्ट ब्रीडर रिएक्टर है। तो कमर्शियल उत्पादन के लिए तैयार है। और इस रिएक्टर का डिजाइन किसने किया है इसको"},{"id":565,"q":"और इस रिएक्टर का डिजाइन किसने किया है इसको","options":["अशोक लाहड़ी हैं","","ज्ञानेश कुमार हैं","यह भी याद रखिएगा"],"answer":"D","answer_text":"यह भी याद रखिएगा","explanation":"आईजीसीएआर यानी इंदिरा गांधी सेंटर फॉर एटॉमिक रिसर्च उसी ने तैयार किया है"},{"id":566,"q":"जितना ईंधन लेता है उससे ज्यादा ईंधन यह देता है और उस ईंधन का इस्तेमाल क्या होगा","options":["अशोक लाहड़ी हैं","","ज्ञानेश कुमार हैं","फिर प्लूटोनियम आएगा"],"answer":"D","answer_text":"फिर प्लूटोनियम आएगा","explanation":"अधिक से अधिक प्लूटोनियम आ जाएगा और फिर हम थोरियम आधारित स्टेज थ्री इस्तेमाल कर सकते हैं। तो थोरियम क्या है"},{"id":567,"q":"उसके लिए क्या करना पड़ता है","options":["","अशोक लाहड़ी हैं","उसके लिए ह xt":"इसमें ना हैवी वाटर नहीं इस्तेमाल किया जाता है","explanation":"पहला स्टेज जो था वह हैवी वाटर था और यह इसमें सोडियम का इस्तेमाल किया जाता है। क्यों"},{"id":572,"q":"इसरो के द्वारा किया गया आईएडीटी टू यानी इंटीग्रेटेड एयर ड्रॉप टेस्ट टू परीक्षण किस मिशन से संबंधित है","options":["गगनयान मिशन से संबंधित है","","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं"],"answer":"A","answer_text":"गगनयान मिशन से संबंधित है","explanation":"और 10 अप्रैल को यह महत्वाकांक्षी गगनयान मिशन के तहत ये ड्रॉप टेस्ट कराया गया। यह है क्या"},{"id":573,"q":"नासा के आर्टिमेस टू मिशन का लक्ष्य क्या है","options":["","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं","चंद्रमा की परिक्रमा परिक्रमा करने वाला मानव मिशन"],"answer":"D","answer_text":"चंद्रमा की परिक्रमा परिक्रमा करने वाला मानव मिशन","explanation":"ओके"},{"id":574,"q":"किस राज्य सरकार ने नौवीं से 12वीं के छात्रों के डिजिटल इस्तेमाल को लेकर ड्राफ्ट पॉलिसी जारी की है जिसमें शाम के बाद इंटरनेट बंद करने की भी सिफारिश की गई है","options":["सिक्किम","वो है अरुणाचल प्रदेश","है लद्दाख","कर्नाटक"],"answer":"D","answer_text":"कर्नाटक","explanation":"वैज्ञानिकों के अनुसार शनि की कक्षा में 11 नए चंद्रमा की खोज हुई। तो शनि के चंद्रमा की कुल संख्या कितनी हो गई है"},{"id":575,"q":"शनि के चंद्रमा की कुल संख्या कितनी हो गई है","options":["₹00 से ₹1 लाख देने का ऐलान किया है","टोटल विधेयक जो है ना वो है 12","285","वो है 12 मिनट"],"answer":"C","answer_text":"285","explanation":""},{"id":576,"q":"ये मिशन कब शुरू किया गया था","options":["धार","बीजेपी","नेशनल ह्यूमन राइट्स कमीशन","नाविक"],"answer":"D","answer_text":"नाविक","explanation":""},{"id":577,"q":"अगर नेविगेशन अपना ना हो तो फिर तो क्या होगा","options":["ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","ये जीपीएस का तो यूज कर नहीं पाएगा",""],"answer":"C","answer_text":"ये जीपीएस का तो यूज कर नहीं पाएगा","explanation":"जीपीएस ब्लॉक कर देगा अमेरिका। ऐसी स्थिति हालात ना हो इसलिए ये नाविक बहुत जरूरी था हमारे लिए। तो अब कोशिश होगी खबरें आई हैं कि अब नए सेटेलाइट भेजे जाएंगे और नाविक को ठीक किया जाएगा। पूर्ण चंद्र ग्रह ग्रहण जो कि 3 मार्च ह d":589,"q":"18वें ब्रिक्स समिट में विदेशी राष्ट्रध्यक्षों के स्वागत के लिए भारत मंडप में किस प्रसिद्ध मंदिर के गलियारे का डिजिटल बैक ड्रॉप इस्तेमाल किया गया","options":["","राम नाथ स्वामी मंदिर रामेश्वरम","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं"],"answer":"B","answer_text":"राम नाथ स्वामी मंदिर रामेश्वरम","explanation":"तो वहां का दरअसल यह फोटोग्राफ आप देखेंगे तो इसके पीछे की ओर यह मंदिर का पूरा ऐसा लगेगा कि उसका मंदिर के जो गलियारा है ना वहां पर तो वैसा ही लगेगा। तो यह है महत्वपूर्ण तमाम लीडर्स का स्वागत यहीं पर किया गया"},{"id":590,"q":"वर्ष 2027 में ब्रिक्स की अध्यक्षता किसके पास होगी","options":["अशोक लाहड़ी हैं","चीन के पास होगी","ज्ञानेश कुमार हैं",""],"answer":"B","answer_text":"चीन के पास होगी","explanation":"चीन जो है ना वह अध्यक्षता करेगा और 19वां वृक्ष शिखर सम्मेलन वह चीन में होने जा रहा है। अब बात करते हैं जो न्यू दिल्ली डिक्लेरेशन किया गया उसमें क्या-क्या बातचीत हुई है। दरअसल सर्वस्मति से ये घोषणापत्र को जारी कर दिया गया। देखिए ईरान और यूक्रेन में जो चल रहा युद्ध है उसको लेकर सदस्यों के बीच में बहुत मतभेद थे। बहुत ज्यादा। तो यह उन सब से परे होकर सब ने सर्वसम्मति से यह घोषणा पत्र को अपना लिया। 140 पॉइंट्स थे इसमें और इसके जो प्रमुख चीजें हैं उनमें अगर हम कहेंगे तो एक तो 10 सूत्रीय रोड मैप बताया गया कि वैश्विक शासन द"},{"id":591,"q":"आगे बढ़ते हैं और अगला जो क्वेश्चन है वो है ब्रिक्स साझा मुद्रा का क्या हुआ है","options":["","अशोक लाहड़ी हैं","देखिए जो समापन हुआ उस में मतलब ब्रिक्स समिट में पूरी तरह से इसको ठंडे बस्ते में डाल दिया गया","ज्ञानेश कुमार हैं"],"answer":"C","answer_text":"देखिए जो समापन हुआ उस में मतलब ब्रिक्स समिट में पूरी तरह से इसको ठंडे बस्ते में डाल दिया गया","explanation":"विदेश मंत्रालय ने बाद में जो है ना बयान भी जारी किया और प्रेस ब्रीफ़िंग की और स्पष्ट किया कि Bricks के पास अपनी कोई एकल साझा मुद्रा को लाने का वर्तमान में कोई प्रस्तावचाराधीन नहीं है"},{"id":592,"q":"आगे बात है कि 18वें ब्रिक्स समिट के दौरान किस देश ने सदस्य देशों के लिए ओपन सोर्स एआई जोन बनाने का प्रस्ताव रखा","options":["","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","चीन ने ये किया है"],"answer":"D","answer_text":"चीन ने ये किया है","explanation":"चीन का कहना है कि ऐसा इकोसिस्टम हम चाहते हैं सबको मिले। ओपन सोर्स हो, एल्गोरिदम हो जो सभी ब्रिक्स के देश के लिए सुलभ हो"},{"id":593,"q":"18वें ब्रिक्स शिखर सम्मेलन के दौरान प्राइम मिनिस्टर नरेंद्र मोदी ने कितने स्मारक डाक टिकट जारी किए","options":["दो डाक टिकट जारी किए और ये है ₹5 और ₹25 का स्मारक डाक टिकट","₹00 से ₹1 लाख देने का ऐलान किया है","टोटल विधेयक जो है ना वो है 12","वो है 12 मिनट"],"answer":"A","answer_text":"दो डाक टिकट जारी किए और ये है ₹5 और ₹25 का स्मारक डाक टिकट","explanation":"कि ब्रिक्स समिट 2026 के शेरपा कौन थे या है"},{"id":594,"q":"ब्रिक्स समिट 2026 के शेरपा कौन थे या है","options":["","सुधाकर दलीला वो सीनियर डिप्लोमेट हैं","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं"],"answer":"B","answer_text":"सुधाकर दलीला वो सीनियर डिप्लोमेट हैं","explanation":"1993 बैच के आईएफएस अधिकारी हैं। तो उनको बनाया गया था शेरपा। शिरपा जो होता है ना वो मतलब कि जो तमाम देश हैं उन सब से कोऑर्डिनेशन करने का काम वगैरह का मुख्य जिम्मेदारी इन्हीं की होती है। कि संयुक्त राष्ट्र महासभा यानी यूएनजीए द्वारा पारित करेक्ट द मैप प्रस्ताव मुख्य रूप से मार्केटर नक्शे में किस भूभाग के गलत आकृति को सुधारने से संबंधित है"},{"id":595,"q":"संयुक्त राष्ट्र महासभा यानी यूएनजीए द्वारा पारित करेक्ट द मैप प्रस्ताव मुख्य रूप से मार्केटर नक्शे में किस भूभाग के गलत आकृति को सुधारने से संबंधित है","options":["वो है ग्रीनलैंड","","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं"],"answer":"A","answer_text":"वो है ग्रीनलैंड","explanation":""},{"id":596,"q":"करेक्ट द मैप यह था और इसको किसने पेश किया था","options":["ज्ञानेश कुमार हैं","टोगो एक देश है, अफ्रीक देश है","अशोक लाहड़ी हैं",""],"answer":"B","answer_text":"टोगो एक देश है, अफ्रीक देश है","explanation":"उसी ने इस प्रस्ताव को पेश किया था और इसको भारत ने भी सपोर्ट किया और यह आखिरकार पारित हो चुका है"},{"id":597,"q":"अंतरराष्ट्रीय संगठन से और क्वेश्चन होगा 26वां एसइओ शिखर सम्मेलन किस शहर व देश में आयोजित हुआ","options":["","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं","बिकेक में किरगिस्तान की राजधानी है बिकेक वहीं पर यह आयोजन हुआ है"],"answer":"D","answer_text":"बिकेक में किरगिस्तान की राजधानी है बिकेक वहीं पर यह आयोजन हुआ है","explanation":"और ये कब से कब तक हुआ"},{"id":598,"q":"और ये कब से कब तक हुआ","options":["टोटल विधेयक जो है ना वो है 12","वो है 12 मिनट","₹00 से ₹1 लाख देने का ऐलान किया है","31 अगस्त से 1 सितंबर तक यह आयोजन किया गया है"],"answer":"D","answer_text":"31 अगस्त से 1 सितंबर तक यह आयोजन किया गया है","explanation":""},{"id":599,"q":"शघाई सहयोग संगठन की अध्यक्षता सितंबर 2026 में किसने संभाली","options":["","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","पाकिस्तान ने संभाल ली है और ये जो है ना अध्यक्षता वो रोटेशन क्रम में मिली है"],"answer":"D","answer_text":"पाकिस्तान ने संभाल ली है और ये जो है ना अध्यक्षता वो रोटेशन क्रम में मिली है","explanation":"रूसी वर्णमाला यानी रशियन अल्फाबेट उसके आधार पर ये मिलता है। जैसे भारत को भी जो अध्यक्षता मिली थी ना कुछ साल पहले वो ऐसे ही मिली थी। तो इस बार पाकिस्तान को मिला है और पाकिस्तान के जो प्राइम मिनिस्टर हैं शाहबाज शरीफ उन्होंने अध्यक्षता ग्रहण की है। किस शहर को वर्ष 2026-27 के लिए सीईओ पर्यटन और सांस्कृतिक राजधानी का दर्जा प्राप्त हुआ"},{"id":600,"q":"अगला शहर कौन सा है? कि रूसी और चीनी भाषा के बाद तीसरी किस भाषा को शघाई सहयोग संगठन की आधिकारिक और कामकाजी भाषा के रूप में दर्जा मिला है","options":["अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं","","अंग्रेजी को मिला है"],"answer":"D","answer_text":"अंग्रेजी को मिला है","explanation":""},{"id":601,"q":"एसइओ सिविलाइजेशन डायलॉग फोरम के प्रथम संस्कृत की मेजबानी किस देश को मिली है","options":["ज्ञानेश कुमार हैं","","भारत को मिली है और यह भारत में आयोजन होगा","अशोक लाहड़ी हैं"],"answer":"C","answer_text":"भारत को मिली है और यह भारत में आयोजन होगा","explanation":"ये एक मंच है जिसमें सांस्कृतिक आदान-प्रदान ऐतिहासिक विरासतों का संरक्षण पर चर्चा वगैरह होगी। अगला क्वेश्चन कि एसइओ समिट 2026 में किस बैंक की स्थापना के दिशा में काम जारी रखने पर सहमति बनी है"},{"id":602,"q":"एसइओ समिट 2026 में किस बैंक की स्थापना के दिशा में काम जारी रखने पर सहमति बनी है","options":["","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं","एसइओ डेवलपमेंट बैंक"],"answer":"D","answer_text":"एसइओ डेवलपमेंट बैंक","explanation":""},{"id":603,"q":"मुद्रा कौन सी इस्तेमाल होगी","options":["युवान होगी चीन की या रूस की रूबल होगी या कौन सी मुद्रा होगी","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं",""],"answer":"A","answer_text":"युवान होगी चीन की या रूस की रूबल होगी या कौन सी मुद्रा होगी","explanation":"युवान होगी चीन की या रूस की रूबल होगी या कौन सी मुद्रा होगी"},{"id":604,"q":"मुद्रा कौन सी इस्तेमाल होगी? युवान होगी चीन की या रूस की रूबल होगी या कौन सी मुद्रा होगी","options":["ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","इन सब चीजों पर बातचीत होने है अभी",""],"answer":"C","answer_text":"इन सब चीजों पर बातचीत होने है अभी","explanation":""},{"id":605,"q":"अमेरिकी राष्ट्रपति ने यूएसए और कनाडा के बीच में स्थित किस झील का नाम बदलकर लेक अमेरिका कर दिया है","options":["अशोक लाहड़ी हैं","","ज्ञानेश कुमार हैं","लेक ओंटारियो लेक ओंटारियो जो था ना उसी का नाम बदल दिया गया है"],"answer":"D","answer_text":"लेक ओंटारियो लेक ओंटारियो जो था ना उसी का नाम बदल दिया गया है","explanation":"दरअसल ट्रेड वॉर चल रहा है दोनों देशों के बीच में। कौन-कौन से देश"},{"id":606,"q":"एक बार मैप के जरिए देखते हैं अपना प्यारा भारत है और चलते हैं कहां","options":["अमेरिका और कनाडा की ओर","","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं"],"answer":"A","answer_text":"अमेरिका और कनाडा की ओर","explanation":""},{"id":607,"q":"क्वेश्चन होगा कि पहली बार किस भारतीय को फाइनेंसियल एक्शन टास्क फोर्स यानी एफएटीएफ का उपाध्यक्ष नियुक्त किया गया","options":["","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","विवेक अग्रवाल को नियुक्त किया गया है"],"answer":"D","answer_text":"विवेक अग्रवाल को नियुक्त किया गया है","explanation":"2026-27 के लिए एक साल के लिए इनको उपाध्यक्ष की जिम्मेदारी दी गई है। वह 1994 बैच के मध्य प्रदेश कैडर के आईएएस अधिकारी हैं वो"},{"id":608,"q":"उसका पहला मध्य एशियाई सदस्य देश कौन बना है","options":["","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","उज्बेकिस्तान बना है"],"answer":"D","answer_text":"उज्बेकिस्तान बना है","explanation":"जून में औपचारिक रूप से एनडीबी का शेयर  है। तो भारत के लिए नुकसानदायक भी है। यह जो पोर"},{"id":658,"q":"प्रश्न यहां पर होगा कि भारत न्यूजीलैंड रणनीतिक साझेदारी ने स्ट्रेटजी पार्टनरशिप रोड मैप 2030 के तहत दोनों देशों ने द्विपक्षीय व्यापार कितना करने का लक्ष्य रखा है","options":["टोटल विधेयक जो है ना वो है 12","₹35,000 करोड़ में कहेंगे और अगर न्यूजीलैंड अह डॉलर में कहेंगे तो वह 7 बिलियन न्यूजीलैंड डॉलर कहा जाएगा","₹00 से ₹1 लाख देने का ऐलान किया है","वो है 12 मिनट"],"answer":"B","answer_text":"₹35,000 करोड़ में कहेंगे और अगर न्यूजीलैंड अह डॉलर में कहेंगे तो वह 7 बिलियन न्यूजीलैंड डॉलर कहा जाएगा","explanation":""},{"id":659,"q":"प्राइम मिनिस्टर नरेंद्र मोदी की न्यूजीलैंड यात्रा के दौरान दोनों देशों के बीच में कितने समझौतों पर सिग्नेचर हुए हैं","options":["टोटल विधेयक जो है ना वो है 12","वो है 12 मिनट","₹00 से ₹1 लाख देने का ऐलान किया है","10 समझौतों पर सिग्नेचर किए गए हैं"],"answer":"D","answer_text":"10 समझौतों पर सिग्नेचर किए गए हैं","explanation":"और यह है जैसे एक है समुद्री जो सहयोग पर व्यवस्था करना है। दोनों देश ये कर रहे हैं। दूसरा है कि लॉजिस्टिक सपोर्ट समझौता है। दूसरा वाला। तीसरा है हाइड्रोग्राफी और नववाहन सहयोग"},{"id":660,"q":"ये फैसला किस देश में लिया गया","options":["","अशोक लाहड़ी हैं","फ्रांस में लिया गया","ज्ञानेश कुमार हैं"],"answer":"C","answer_text":"फ्रांस में लिया गया","explanation":"फ्रांस का राजधानी पेरिस में 13 जुलाई को यह मीटिंग हुई है। और इसमें यूक्रेन, फ्रांस, जर्मनी, ब्रिटेन, इटली, नीदरलैंड, डेनमार्क, नॉर्वे, स्पेन, स्वीडन ये सब देश शामिल थे। कि लद्दाख प्रशासन द्वारा किस अरब देश के साथ समझौता ज्ञापन पर सिग्नेचर के कुछ महीने बाद प्रीमियम खुबानी एक्सपोर्ट किया गया है"},{"id":661,"q":"भारत और यूनाइटेड किंगडम के बीच में 15 जुलाई 2026 को किस तरह का ट्रेड एग्रीमेंट लागू हुआ है","options":["ज्ञानेश कुमार हैं","","अशोक लाहड़ी हैं","सीईटीए देखिए ट्रेड एग्रीमेंट ना कई तरीके के होते हैं"],"answer":"D","answer_text":"सीईटीए देखिए ट्रेड एग्रीमेंट ना कई तरीके के होते हैं","explanation":"उसी में यह सीईटी है। है यानी कॉम्प्रहेंसिव इकोनॉमिक एंड ट्रेड एग्रीमेंट। आम भाषा में कई बार एफटीए कह दिया जाता है। लेकिन एक एक्चुअल में ये एफटीए नहीं है। एफटीए का मतलब होता है कि पूरी तरह से फ्री मार्केट को कर देना दोनों देश। यहां पर कुछ चीजों पर लगाम है। तो भारत और ब्रिटेन के बीच में 24 जुलाई को सीईटीए जो लागू हो गया है। वैसे तो यह एक साल पहले सिग्नेचर हुआ था प्राइम मिनिस्टर नरेंद्र मोदी और उस वक्त जो ब्रिटेन के प्राइम मिनिस्टर थे कि स्टारमा उनके मौजूदगी में। लेकिन यह एक साल बाद यानी 15 जुलाई 2026 को लागू हुआ है"},{"id":662,"q":"जून 2026 में किस देश के 50वें राष्ट्रीय दिवस समारोह में सम्मानित अतिथि के रूप में शामिल हुए","options":["बीजेपी","धार","कौन","नेशनल ह्यूमन राइट्स कमीशन"],"answer":"C","answer_text":"कौन","explanation":"कौन"},{"id":663,"q":"स्पेशल्स को अगर देखेंगे वो कहां पर है","options":["ज्ञानेश कुमार हैं","","यह पूर्वी अफ्रीका के तट से दूर इस लोकेशन के पास में है","अशोक लाहड़ी हैं"],"answer":"C","answer_text":"यह पूर्वी अफ्रीका के तट से दूर इस लोकेशन के पास में है","explanation":""},{"id":664,"q":"चलिए आगे बढ़ते हैं और कि ये सऊदी अरब में भारत के नए राजदूत कौन नियुक्त हुए हैं","options":["","अशोक लाहड़ी हैं","ज्ञानेश कुमार हैं","विपुल नाम है उनका"],"answer":"D","answer_text":"विपुल नाम है उनका","explanation":"अनुभवी राजनयिक हैं वो। ओमान में भारत के नए राजदूत कौन बने हैं"},{"id":665,"q":"ओमान में भारत के नए राजदूत कौन बने हैं","options":["","ज्ञानेश कुमार हैं","अशोक लाहड़ी हैं","प्रशांत पीसे बने हैं"],"answer":"D","answer_text":"प्रशांत पीसे बने हैं","explanation":"वह भारतीय विदेश सेवा के अधिकारी हैं वह। कि यूएसए और ईरान के बीच में युद्ध ख़ करने के लिए जो अंतरिम समझौता हुआ था एमओयू साइन हुआ था उसमें किस तीसरे देश के प्राइम मिनिस्टर ने मध्यस्थ की भूमिका में सिग्नेचर किया"},{"id":666,"q":"यूएसए और ईरान के बीच में युद्ध ख़ करने के लिए जो अंतरिम समझौता हुआ था एमओयू साइन हुआ था उसमें किस तीसरे देश के प्राइम मिनिस्टर ने मध्यस्थ की भूमिका में सिग्नेचर किया","options":["धार","नेशनल ह्यूमन राइट्स कमीशन","पाकिस्तान","बीजेपी"],"answer":"C","answer_text":"पाकिस्तान","explanation":"हालांकि यह जो है ना वो बहुत दिन चल नहीं पाया। कुछ ही दिनों में ही यह जो संधि थी ये जो एमओयू था स his as the answer."}];
const PART_SIZE = 50;
const PARTS = [];
for(let i=0;i<QUESTIONS.length;i+=PART_SIZE) PARTS.push([i,Math.min(i+PART_SIZE,QUESTIONS.length)]);

let currentPart = -1;
let currentStart = 0;
let currentEnd = 0;
let state = [];
let timerId = null;
let secondsLeft = 600;

const partsEl = document.getElementById('parts');

PARTS.forEach((p,idx)=>{
  const d=document.createElement('button');
  d.className='part';
  d.innerHTML=`<b>Part ${idx+1}</b><span>${p[1]-p[0]} MCQs</span><div class="small">Q${p[0]+1}–Q${p[1]}</div>`;
  d.onclick=()=>startPart(idx);
  partsEl.appendChild(d);
});

function startPart(idx){
  stopTimer();
  currentPart=idx;
  currentStart=PARTS[idx][0];
  currentEnd=PARTS[idx][1];
  state=Array(currentEnd-currentStart).fill(null);
  document.getElementById('hub').style.display='none';
  document.getElementById('test').style.display='block';
  document.getElementById('partLabel').textContent=`Part ${idx+1} • Q${currentStart+1}–Q${currentEnd}`;
  document.getElementById('result').style.display='none';
  renderQuestions();
  secondsLeft=600;
  updateTimer();
  timerId=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0){stopTimer();finishTest(true);}},1000);
  window.scrollTo({top:0,behavior:'smooth'});
}

function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function updateTimer(){
  const m=String(Math.max(0,Math.floor(secondsLeft/60))).padStart(2,'0');
  const s=String(Math.max(0,secondsLeft%60)).padStart(2,'0');
  document.getElementById('timer').textContent=`${m}:${s}`;
}

function renderQuestions(){
  const box=document.getElementById('questions');
  box.innerHTML='';
  for(let local=0;local<currentEnd-currentStart;local++){
    const q=QUESTIONS[currentStart+local];
    const card=document.createElement('div');
    card.className='question';
    card.id=`qcard-${local}`;
    let opts='';
    q.options.forEach((op,j)=>{
      const letter='ABCD'[j];
      opts+=`<button class="opt" data-local="${local}" data-letter="${letter}" onclick="choose(${local},'${letter}')"><b>${letter}.</b> ${escapeHtml(op)}</button>`;
    });
    card.innerHTML=`
      <div class="qhead"><div class="qnum">Q${q.id}</div></div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="options">${opts}</div>
      <div class="explain" id="exp-${local}">
        <b>Answer: ${q.answer}</b> — ${escapeHtml(q.answer_text)}<br>
        <span><b>Explanation:</b> ${escapeHtml(q.explanation)}</span>
        <div class="key">Key Point: ${escapeHtml(q.answer_text)}</div>
      </div>`;
    box.appendChild(card);
  }
  updateCounters();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function choose(local,letter){
  if(state[local]) return;
  const q=QUESTIONS[currentStart+local];
  state[local]={letter,correct:letter===q.answer};
  const card=document.getElementById(`qcard-${local}`);
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.classList.add('disabled');
    if(btn.dataset.letter===q.answer) btn.classList.add('correct');
    if(btn.dataset.letter===letter && letter!==q.answer) btn.classList.add('wrong');
  });
  document.getElementById(`exp-${local}`).classList.add('show');
  updateCounters();
}

function updateCounters(){
  let c=0,w=0,u=0;
  state.forEach(x=>{if(!x)u++;else if(x.correct)c++;else w++;});
  document.getElementById('correctCount').textContent=c;
  document.getElementById('wrongCount').textContent=w;
  document.getElementById('unvisitedCount').textContent=u;
  const done=state.filter(Boolean).length;
  document.getElementById('progressBar').style.width=((done/state.length)*100)+'%';
}

function finishTest(auto=false){
  stopTimer();
  // Reveal all correct answers and explanations after Finish.
  state.forEach((x,i)=>{
    const q=QUESTIONS[currentStart+i];
    const card=document.getElementById(`qcard-${i}`);
    card.querySelectorAll('.opt').forEach(btn=>{
      btn.classList.add('disabled');
      if(btn.dataset.letter===q.answer) btn.classList.add('correct');
    });
    document.getElementById(`exp-${i}`).classList.add('show');
  });
  let c=0,w=0,u=0;
  const corr=[],wrong=[],unv=[];
  state.forEach((x,i)=>{
    const n=QUESTIONS[currentStart+i].id;
    if(!x){u++;unv.push(n);}
    else if(x.correct){c++;corr.push(n);}
    else{w++;wrong.push(n);}
  });
  const score=c-(w/3);
  const pct=((score/state.length)*100);
  const result=document.getElementById('result');
  result.style.display='block';
  document.getElementById('resultText').innerHTML=
    `<b>${auto?'Time is over. ':''}Score:</b> ${score.toFixed(2)} / ${state.length}
     &nbsp; | &nbsp; <b>Percentage:</b> ${pct.toFixed(2)}%
     &nbsp; | &nbsp; <b>Attempted:</b> ${c+w}
     &nbsp; | &nbsp; <b>Unattempted:</b> ${u}<br>
     <span class="small">Marking: +1 correct, −1/3 incorrect, 0 for unattempted.</span>`;
  document.getElementById('correctList').textContent=corr.length?corr.join(', '):'—';
  document.getElementById('wrongList').textContent=wrong.length?wrong.join(', '):'—';
  document.getElementById('unvisitedList').textContent=unv.length?unv.join(', '):'—';
  result.scrollIntoView({behavior:'smooth',block:'start'});
}

function resetPart(){
  if(!confirm('Reset this part? All answers will be cleared.')) return;
  startPart(currentPart);
}

function backToHub(){
  stopTimer();
  document.getElementById('test').style.display='none';
  document.getElementById('hub').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
